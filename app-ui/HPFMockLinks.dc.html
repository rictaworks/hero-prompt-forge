<div style="border-top:1px solid rgba(255,255,255,.07);background:#111;padding:26px 6%;display:flex;flex-direction:column;gap:14px">
  <span style="font-family:var(--font-display);font-size:9px;font-weight:700;letter-spacing:.2em;color:#555">MOCK INDEX — 全9画面</span>
  <div style="display:flex;flex-wrap:wrap;gap:2px">
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="9">
      <a href="{{ l.href }}" style="display:flex;align-items:baseline;gap:8px;padding:10px 14px;border:1px solid rgba(255,255,255,.07);background:#141414;text-decoration:none">
        <span style="font-family:var(--font-display);font-size:9px;font-weight:900;color:#c0392b">{{ l.no }}</span>
        <span style="font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#ccc">{{ l.en }}</span>
        <span style="font-family:var(--font-body);font-size:10.5px;color:#666">{{ l.ja }}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:140}}">
class Component extends DCLogic {
  renderVals() {
    return {
      links: [
        { no: '01', en: 'Landing', ja: 'ランディング', href: 'Landing.dc.html' },
        { no: '02', en: 'Projects', ja: '履歴・一覧', href: 'Projects.dc.html' },
        { no: '03', en: 'New Request', ja: '入力フォーム', href: 'NewRequest.dc.html' },
        { no: '04', en: 'Generating', ja: '生成中', href: 'Generating.dc.html' },
        { no: '05', en: 'Result', ja: '結果3案', href: 'Result.dc.html' },
        { no: '06', en: 'Evaluation', ja: '評価メモ', href: 'Evaluation.dc.html' },
        { no: '07', en: 'Presets', ja: 'プリセット', href: 'Presets.dc.html' },
        { no: '08', en: 'Degraded', ja: '縮退・エラー', href: 'Degraded.dc.html' },
        { no: '09', en: 'Admin', ja: '規則辞書', href: 'Admin.dc.html' }
      ]
    };
  }
}
</script>
