<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:64},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Projects&quot;,&quot;Presets&quot;,&quot;Admin&quot;,&quot;None&quot;],&quot;default&quot;:&quot;Projects&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;plan&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PLAN · ACTIVE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;user&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;@ao_design&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'Projects';
    return {
      onProjects: a === 'Projects',
      onPresets: a === 'Presets',
      onAdmin: a === 'Admin',
      plan: this.props.plan ?? 'PLAN · ACTIVE',
      user: this.props.user ?? '@ao_design'
    };
  }
}
</script>
