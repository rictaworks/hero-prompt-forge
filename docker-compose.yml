# 開発用の構成です。WSL2 上の Docker Engine で起動します。
# 起動 : docker compose up -d
# 入室 : docker compose exec dev bash
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: hero
      POSTGRES_PASSWORD: hero_development_only
      POSTGRES_DB: hero_prompt_forge_development
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 他リポジトリの dev コンテナと衝突しないよう、ホスト側をずらしています。
      # questboard が 5432 / 3000 / 3001、x-follower-gate が 5434 / 3200 / 3201 を使います。
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero -d hero_prompt_forge_development"]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: "1000"
        USER_GID: "1000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Tokyo
      # 開発用の接続先です。本番の値はここに書きません。
      DATABASE_URL: postgres://hero:hero_development_only@db:5432/hero_prompt_forge_development
      TEST_DATABASE_URL: postgres://hero:hero_development_only@db:5432/hero_prompt_forge_test
    volumes:
      - .:/workspace
      - bundle:/bundle
    working_dir: /workspace
    ports:
      # コンテナ内は 3000 : Next.js / 3001 : Rails API です。
      # ホスト側は他リポジトリと衝突しない番号へずらしています。
      - "127.0.0.1:3300:3000"
      - "127.0.0.1:3301:3001"
    tty: true
    stdin_open: true

volumes:
  db-data:
  bundle:
