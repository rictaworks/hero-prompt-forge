# 開発用の構成です。WSL2 上の Docker Engine で起動します。
# 起動 : docker compose up -d
# 入室 : docker compose exec dev bash
services:
  db:
    image: postgres:16-bookworm
    environment:
      # 値は .env から読みます。未設定なら起動時に失敗します（既定値を持たせません）。
      POSTGRES_USER: ${POSTGRES_USER:?.env に POSTGRES_USER を設定してください}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: ${POSTGRES_DB:?.env に POSTGRES_DB を設定してください}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 他リポジトリの dev コンテナと衝突しないよう、ホスト側をずらしています。
      # questboard が 5432 / 3000 / 3001、x-follower-gate が 5434 / 3200 / 3201 を使います。
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero -d hero_prompt_forge_development"]
      interval: 5s
      timeout: 5s
      retries: 20

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: "1000"
        USER_GID: "1000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Tokyo
      # 値は .env から読みます。ソースに接続情報を書きません。
      APP_ENV: ${APP_ENV:?.env に APP_ENV を設定してください}
      DATABASE_URL: ${DATABASE_URL:?.env に DATABASE_URL を設定してください}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:?.env に TEST_DATABASE_URL を設定してください}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:?.env に NEXT_PUBLIC_APP_ENV を設定してください}
      # 開発者用の管理画面の資格情報です。未設定なら管理画面は開けません。
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_USER:-}
      ADMIN_BASIC_AUTH_PASSWORD: ${ADMIN_BASIC_AUTH_PASSWORD:-}
      # X ログインです。**未設定でも起動します。** ログインの経路だけが使えません。
      # `.env` に値があっても、ここへ並べないとコンテナへ届きません
      # （PR #166 の pr-checker で実測されました）。
      X_OAUTH_CLIENT_ID: ${X_OAUTH_CLIENT_ID:-}
      X_OAUTH_CLIENT_SECRET: ${X_OAUTH_CLIENT_SECRET:-}
      X_OAUTH_REDIRECT_URI: ${X_OAUTH_REDIRECT_URI:-}
      # フォロワー判定サービスです。**ドメインを公開しません。**
      FOLLOWER_GATE_BASE_URL: ${FOLLOWER_GATE_BASE_URL:-}
      FOLLOWER_GATE_CLIENT_ID: ${FOLLOWER_GATE_CLIENT_ID:-}
      FOLLOWER_GATE_CREDENTIAL: ${FOLLOWER_GATE_CREDENTIAL:-}
      # ログインの後に戻す先です。
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-}
      # 画面の公開先です。**ブラウザへ配ってよい値です。**
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-}
      # 画面からバックエンドへの中継先です。**ブラウザへ配りません。**
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-}
      # 開発・テストでのみ効く自動ログインです。**本番では効きません。**
      DEVELOPMENT_AUTO_LOGIN_X_USER_ID: ${DEVELOPMENT_AUTO_LOGIN_X_USER_ID:-}
      # LLM による精緻化です。未設定なら呼び出さずに縮退します。
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Bot 対策です。開発では未設定なら照合を飛ばします。**本番では必須です。**
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
      # ブラウザ操作による確認の接続先です。**開発サーバーだけを指します。**
      E2E_BASE_URL: ${E2E_BASE_URL:-}
    volumes:
      - .:/workspace
      - bundle:/bundle
      - playwright:/ms-playwright
    working_dir: /workspace
    ports:
      # コンテナ内は 3000 : Next.js / 3001 : Rails API です。
      # ホスト側は他リポジトリと衝突しない番号へずらしています。
      - "127.0.0.1:3300:3000"
      - "127.0.0.1:3301:3001"
    tty: true
    stdin_open: true

volumes:
  db-data:
  bundle:
  playwright:
