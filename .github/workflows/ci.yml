name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Tokyo

jobs:
  backend:
    name: バックエンド（RuboCop / RSpec）
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: hero
          POSTGRES_PASSWORD: hero_ci_only
          POSTGRES_DB: hero_prompt_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      RAILS_ENV: test
      DATABASE_URL: postgres://hero:hero_ci_only@localhost:5432/hero_prompt_forge_test
      TEST_DATABASE_URL: postgres://hero:hero_ci_only@localhost:5432/hero_prompt_forge_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch, 2026-08-31時点
        with:
          working-directory: src/backend
          bundler-cache: true

      - name: 書き方の検査
        working-directory: src/backend
        run: bundle exec rubocop --format simple

      # テスト用のデータベースは、スキーマだけを作ります。
      # db:prepare は表の無いデータベースへ初期データ（db/seeds.rb）まで流すため、
      # 初期データとテストの作るデータが衝突します。テストは初期データを前提にしません。
      - name: データベースの準備
        working-directory: src/backend
        run: bin/rails db:test:prepare

      - name: テスト
        working-directory: src/backend
        run: bundle exec rspec

  frontend:
    name: フロントエンド（ESLint / 型検査 / Jest / ビルド）
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: test
      # 画面の組み立ては、この 2 つが無いとその場で失敗します（既定値を持たせていません）。
      # **どちらも検査のためだけの値です。** 本番の値は配置先の設定から渡します。
      # `BACKEND_INTERNAL_URL` はブラウザへ配りません（バックエンドのドメインを隠蔽します）。
      BACKEND_INTERNAL_URL: http://backend.invalid
      NEXT_PUBLIC_BASE_URL: http://frontend.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: 依存の導入
        working-directory: src/frontend
        run: npm ci

      - name: 書き方の検査
        working-directory: src/frontend
        run: npx eslint .

      - name: テスト
        working-directory: src/frontend
        run: npm test

      # ビルドを型検査より先に実行します。Next.js は画面の型（LayoutProps 等）を
      # ビルド時に生成するため、先に型検査を走らせると生成前の状態で失敗します。
      - name: ビルド
        working-directory: src/frontend
        run: npm run build

      - name: 型検査
        working-directory: src/frontend
        run: npx tsc --noEmit

  production-boot:
    name: 本番と同じ設定での読み込み確認
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: hero
          POSTGRES_PASSWORD: hero_ci_only
          POSTGRES_DB: hero_prompt_forge_production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # TEST_DATABASE_URL をここへ設定しません。本番は DATABASE_URL しか持ちません。
    # 一緒に設定すると、本番で実際に起きる「TEST_DATABASE_URL が無い」状態を
    # このジョブが一度も再現できなくなります（issue #190）。
    env:
      APP_ENV: production
      RAILS_ENV: production
      DATABASE_URL: postgres://hero:hero_ci_only@localhost:5432/hero_prompt_forge_production
      SECRET_KEY_BASE: ci_boot_check_only_not_a_real_secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch, 2026-08-31時点
        with:
          working-directory: src/backend
          bundler-cache: true

      # 本番でだけ起きる不具合（ジョブ・キャッシュの表が作られない等）は、
      # 通常のテストでは見つかりません。本番と同じ設定で実際に触って確認します。
      - name: データベースの準備
        working-directory: src/backend
        run: bin/rails db:prepare

      - name: 読み込み・ジョブ・キャッシュを実際に触る
        working-directory: src/backend
        run: |
          bin/rails runner '
            ActiveRecord::Base.connection.execute("select 1")
            Rails.cache.write(:ci_boot_check, "ok")
            raise "キャッシュが読み書きできません" unless Rails.cache.read(:ci_boot_check) == "ok"
            SolidQueue::Job.count
            raise "本番で開発向けの近道が有効です" if AppEnvironment.developer_shortcuts_allowed?
            puts "本番設定での読み込み・ジョブ・キャッシュ・環境判定: 正常"
          '

  hooks:
    name: 開発フックの検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # 暴走したときにジョブが早く落ちるよう、実行そのものにも時間の上限を付けます
      # （.claude/TEST-HARNESS-SAFETY.md の TH5）。
      - name: マージ前フックの検査
        run: timeout 120 npm run test:hooks

      # **置き場が実行から漏れていないかを確かめます**（issue #142）。
      - name: テストの置き場の検査
        run: timeout 120 npm run test:harness

  hardcode:
    name: ハードコードの検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: 検査の仕組み自体のテスト
        run: npm run test:hardcode

      - name: 直書きの文言が無いことの確認
        run: npm run check:hardcode

      # **文書が黙って嘘になることを防ぎます**（issue #78 ・ #79）。
      # 画面や経路が消えても、文書はそのまま残ります。
      - name: 文書の検査
        run: npm run test:docs

  e2e:
    name: ブラウザ操作の確認（Playwright）
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: hero
          POSTGRES_PASSWORD: hero_ci_only
          POSTGRES_DB: hero_prompt_forge_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # **開発サーバーを立てて確かめます。** 本番を指した場合は、設定の
      # 読み込みの時点で失敗します（`playwright.config.ts`）。
      APP_ENV: development
      RAILS_ENV: development
      DATABASE_URL: postgres://hero:hero_ci_only@localhost:5432/hero_prompt_forge_development
      TEST_DATABASE_URL: postgres://hero:hero_ci_only@localhost:5432/hero_prompt_forge_development
      # 開発環境でだけ効く自動ログインです。**本番では効きません**（`AppEnvironment`）。
      # 画面の確認はログイン後の画面を含みますので、ここで有効にします。
      DEVELOPMENT_AUTO_LOGIN_X_USER_ID: "1000000000000000001"
      NEXT_PUBLIC_APP_ENV: development
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      # **ブラウザへ配りません。** 画面の中継先です。組み立て時に焼き込まれます。
      BACKEND_INTERNAL_URL: http://localhost:3001
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1 branch, 2026-08-31時点
        with:
          working-directory: src/backend
          bundler-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/frontend/package-lock.json

      - name: データベースの準備
        working-directory: src/backend
        run: bin/rails db:prepare

      # **ログイン後の画面を確かめます。** 自動ログインは、この識別子の利用者が
      # 居る場合にだけ効きます（`AuthenticatesUser#development_user`）。
      - name: 自動ログインの利用者を作る
        working-directory: src/backend
        run: |
          bin/rails runner '
            user = User.find_or_initialize_by(x_user_id: ENV.fetch("DEVELOPMENT_AUTO_LOGIN_X_USER_ID"))
            user.display_name = "CI" if user.display_name.blank?
            user.plan = "active"
            user.save!
            puts "自動ログインの利用者を用意しました: #{user.x_user_id}"
          '

      # **確かめる相手を用意します。** 画面の確認は、すでに出来上がった生成の
      # 記録を開きます。**自動検査のデータベースは空ですので、ここで作ります**
      # （PR #179 のレビュー・条件 1）。
      - name: 確認用の記録を用意する
        working-directory: src/backend
        run: bin/rails runner ../../scripts/ci/prepare_e2e_data.rb

      - name: 依存の導入（画面）
        working-directory: src/frontend
        run: npm ci

      - name: 画面の組み立て
        working-directory: src/frontend
        run: npm run build

      - name: 依存の導入（確認の道具）
        run: npm ci

      - name: ブラウザの導入
        run: npx playwright install --with-deps chromium

      # **起動を待ってから次へ進みます。** 待たずに確認へ進むと、
      # 立ち上がりの遅さが「画面が出ない」として現れます。
      - name: バックエンドを起動
        working-directory: src/backend
        run: |
          bin/rails server -p 3001 -b 127.0.0.1 > "$RUNNER_TEMP/rails.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/health > /dev/null; then
              echo "バックエンドが起動しました。"
              exit 0
            fi
            sleep 2
          done
          echo "バックエンドが起動しませんでした。" >&2
          cat "$RUNNER_TEMP/rails.log" >&2
          exit 1

      - name: 画面を起動
        working-directory: src/frontend
        run: |
          npm run start -- -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/ > /dev/null; then
              echo "画面が起動しました。"
              exit 0
            fi
            sleep 2
          done
          echo "画面が起動しませんでした。" >&2
          cat "$RUNNER_TEMP/next.log" >&2
          exit 1

      - name: ブラウザ操作の確認
        run: npx playwright test

      # 落ちたときに、何が起きていたかを追えるようにします。
      - name: 起動の記録
        if: failure()
        run: |
          echo "===== バックエンド ====="
          cat "$RUNNER_TEMP/rails.log" || true
          echo "===== 画面 ====="
          cat "$RUNNER_TEMP/next.log" || true
