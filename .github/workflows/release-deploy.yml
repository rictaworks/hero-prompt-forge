name: リリース配置

# 配置の起点は GitHub Releases の発行です。
# main へのマージだけでは本番は動きません。
on:
  release:
    types: [published]

concurrency:
  group: release-deploy
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  required-attachments:
    name: 必須添付物の確認
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 規程が不在だと監査が「判定不能」を返します。配置の前に必ず確認します。
      - name: 注釈付きタグであることを確認します
        run: |
          TAG="${GITHUB_REF_NAME}"
          TYPE="$(git cat-file -t "$TAG")"
          if [ "$TYPE" != "tag" ]; then
            echo "::error::タグ ${TAG} が注釈付きではありません。git tag -a で作り直してください。"
            exit 1
          fi
          echo "注釈付きタグです: ${TAG}"

      - name: バージョン番号の形式を確認します
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::バージョン番号の形式が違います: ${TAG}（メジャー2桁.マイナー2桁.デバッグ2桁）"
            exit 1
          fi
          echo "形式は正しいです: ${TAG}"

      - name: リリースノートに必須添付物が記載されていることを確認します
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
          MISSING=0
          for NEEDLE in "変更点の一覧" "検証の記録" "監査の結果" "セキュリティゲートの結果" "ユーザーテストの結果"; do
            if ! printf '%s' "$BODY" | grep -q "$NEEDLE"; then
              echo "::error::リリースノートに「${NEEDLE}」がありません。"
              MISSING=1
            fi
          done
          exit "$MISSING"

      - name: 検証・承認の記録が版管理に含まれることを確認します
        run: |
          for DIR in review-records/security-review review-records/reviewer review-records/pr-checker; do
            COUNT="$(git ls-files "$DIR" | grep -c '\.md$' || true)"
            if [ "$COUNT" -lt 1 ]; then
              echo "::error::${DIR} に記録がありません。"
              exit 1
            fi
            echo "${DIR}: ${COUNT} 件"
          done

  backend:
    name: バックエンドを配置します
    needs: required-attachments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Railway CLI を導入します
        run: npm install -g @railway/cli

      - name: 配置します
        working-directory: src/backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend --detach

  frontend:
    name: フロントエンドを配置します
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Vercel CLI を導入します
        run: npm install -g vercel

      - name: 配置します
        working-directory: src/frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"

  verify:
    name: 本番の応答を確認します
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      # 確認先は Variables から読みます。バックエンドのドメインをここに書きません。
      - name: バックエンドの死活確認
        run: |
          URL="${{ vars.BACKEND_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::Variables に BACKEND_HEALTH_URL がありません。"
            exit 1
          fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          echo "死活確認の応答: ${CODE}"
          [ "$CODE" = "200" ]

      - name: 公開画面の確認
        run: |
          URL="${{ vars.FRONTEND_BASE_URL }}"
          if [ -z "$URL" ]; then
            echo "::error::Variables に FRONTEND_BASE_URL がありません。"
            exit 1
          fi
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          echo "公開画面の応答: ${CODE}"
          [ "$CODE" = "200" ]
