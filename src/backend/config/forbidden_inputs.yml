# 禁止入力の検出規則です。
#
# 実在の人物・企業のロゴや商標・第三者の著作物への言及を見つけます
# （requirements.md 4.1 の 1）。見つかった場合は生成を行わず、理由を付して返します。
#
# **語や言い回しを足す場合は、このファイルへ追記します。コードへ直書きしません。**
# 検出は代表的な言い回しに限られます。すべての固有名詞を網羅するものではありません。
#
# 各規則の項目です。
#
#   kind            : 種別です。利用者へ見せる文言は、この種別から上位の層が組み立てます
#   suggestion_key  : 直し方を引くための鍵です。文言そのものはここに書きません
#   patterns        : 見つける言い回しです。空にできません
#
# **通してよい文章を止めないことを、検出することと同じくらい重視します。**
# 日本語の商用文では、職種や立場に敬称を付ける言い回し（「オーナー様」「担当者様」）が
# ごく普通に使われます。ロゴ制作を業務にしている利用者は「ロゴ」と書きます。連携先として
# 企業名を挙げる利用者もいます。**これらを止めると、権利の問題と関係のない利用者が
# 生成をお申し込みになれません。**
#
# そのため、次の考え方で組み立てています。
#
#   - 敬称は「さん」「氏」に限ります。「様」は職種に付く用法が多いため使いません
#   - 敬称の直前が役職の語尾（師・士・員・者・長 など）なら、人名としません
#   - ロゴ・商標は、他社を指す語または既知の企業名と、画面へ置く意図の語が
#     揃った場合に限ります。商標の調査・出願は士業の業務ですので止めません
#   - 一般名詞と重なる作品名（衣類の「ワンピース」など）は入れません
#
# **見送る語を並べる形は採りません。** 職種名は無数にあり並べ切れないうえ、
# 「自社のロゴと他社のロゴ」のように、見送る語を先に書けば迂回できてしまうためです。
# 語彙ではなく、語の形で見分けます。
rules:
  # 実在の人物への言及です。
  #
  # 敬称の直前が役職の語尾（師・士・員・者・長 など）であれば、人名ではなく
  # 職種の呼び方です。**語を並べて見送るのではなく、語の形で見分けます。**
  # 職種名は無数にあり、並べ切れないためです。
  - kind: real_person
    suggestion_key: describe_person_by_role
    patterns:
      # 姓名に敬称が付く言い回しです。役職の語尾で終わる語は人名としません。
      - "[一-龥]{2,4}[[:space:]]?[一-龥]{1,4}(?<![師士員人者長家手屋主店会部課係任生方社場先客工婦官番役名])さん"
      - "[一-龥]{2,4}[[:space:]]?[一-龥]{1,4}(?<![師士員人者長家手屋主店会部課係任生方社場先客工婦官番役])氏(?!名)"
      # カタカナの職種名に「さん」を付ける言い回しが多いため、カタカナは「氏」だけを見ます。
      - "[ァ-ヶー]{3,10}氏(?!名)"
      # 実在の人物を使う意図が明らかな言い回しです。**人を指す語を必須にします。**
      # 「実在する当院の外観写真」のような、人物と関係のない言及を止めないためです。
      - "実在[^。、]{0,8}(?:人物|弁護士|医師|税理士|会計士|俳優|女優|選手|監督|社長|タレント|モデル|歌手|アーティスト)"
      - 本人の写真
      - 有名人
      - 著名人
      # 著名な方のお名前です。
      - 大谷翔平
      - 藤井聡太
      - イチロー
  # 企業のロゴ・商標への言及です。
  #
  # **他社のものを指す語を必須にします。** 「◯◯のロゴ」という形だけでは、
  # 利用者自身のロゴなのか他社のものなのかを判定できません。「事務所のロゴ」
  # 「ブランドのロゴ」は、ほぼ確実に利用者自身のものです。
  - kind: brand_logo
    suggestion_key: remove_third_party_mark
    patterns:
      # 他社を指す語と、画面へ置く意図の語が揃った場合です。
      # **判定の窓に読点を含めます。** 読点を除くと、「他社のロゴマークを、画面の
      # 中央に配置してください」のように読点を挟んだだけで判定が外れます。
      # **意図の語を必須にします。** 商標の調査・出願は士業の中核業務ですので、
      # 「他社の商標を侵害しないか確認します」を止めてはいけません。
      - "(?:他社|他店|他の|別の|よその|競合|取引先|クライアント|先方|第三者)[^。、]{0,10}(?:ロゴ|ロゴマーク|商標|エンブレム)[^。]{0,20}(?:載せ|のせ|入れ|配置|並べ|使い|使う|使用|置き|置く|添え|反映|描|入る|再現|表示|掲載|流用|そのまま|持って)"
      # よく知られた企業名のロゴ・商標を、画面へ置く場合です。
      - "(?i)(?:Apple|Google|Amazon|Microsoft|Nike|スターバックス|マクドナルド|ユニクロ|トヨタ)[[:space:]]*の[[:space:]]*(?:ロゴ|ロゴマーク|商標|エンブレム)[^。]{0,20}(?:載せ|のせ|入れ|配置|並べ|使い|使う|使用|置き|置く|添え|反映|描|入る|再現|表示|掲載|流用|そのまま|持って)"
      # よく知られた企業名を、まねる意図の言い回しとともに使う場合です。
      - "(?i)(?:Apple|Google|Amazon|Microsoft|Nike|スターバックス|マクドナルド|ユニクロ|トヨタ)[^。、]{0,12}(?:のような|のように|風|みたい|そっくり|を再現|をイメージ|に似せ)"
  # 第三者の著作物・作風への言及です。
  #
  # 一般名詞と重なる語（衣類の「ワンピース」、媒体名の「週刊少年」）は入れません。
  - kind: third_party_work
    suggestion_key: describe_style_by_attribute
    patterns:
      - "(?i)(?:ジブリ|ghibli|ディズニー|disney|ピクサー|pixar|ポケモン|pokemon|マーベル|marvel)"
      - "(?:鬼滅の刃|進撃の巨人|新世紀エヴァンゲリオン)"
      - "(?:村上春樹|村上隆|葛飾北斎|草間彌生)"
