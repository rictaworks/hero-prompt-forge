# 禁止入力の検出規則です。
#
# 実在の人物・企業のロゴや商標・第三者の著作物への言及を見つけます
# （requirements.md 4.1 の 1）。見つかった場合は生成を行わず、理由を付して返します。
#
# **語や言い回しを足す場合は、このファイルへ追記します。コードへ直書きしません。**
# 検出は代表的な言い回しに限られます。すべての固有名詞を網羅するものではありません。
#
# 各規則の項目です。
#
#   kind            : 種別です。利用者へ見せる文言は、この種別から上位の層が組み立てます
#   suggestion_key  : 直し方を引くための鍵です。文言そのものはここに書きません
#   patterns        : 見つける言い回しです。空にできません
#
# **通してよい文章を止めないことを、検出することと同じくらい重視します。**
# 日本語の商用文では、職種や立場に敬称を付ける言い回し（「オーナー様」「担当者様」）が
# ごく普通に使われます。ロゴ制作を業務にしている利用者は「ロゴ」と書きます。連携先として
# 企業名を挙げる利用者もいます。**これらを止めると、権利の問題と関係のない利用者が
# 生成をお申し込みになれません。**
#
# そのため、次の考え方で組み立てています。
#
#   - 敬称は「さん」「氏」に限ります。「様」は職種に付く用法が多いため使いません
#   - 敬称の直前が役職の語尾（師・士・員・者・長 など）なら、人名としません
#   - ロゴ・商標は、他社を指す語または既知の企業名と、画面へ置く意図の語が
#     揃った場合に限ります。商標の調査・出願は士業の業務ですので止めません
#   - 一般名詞と重なる作品名（衣類の「ワンピース」など）は入れません
#
# **見送る語を並べる形は採りません。** 職種名は無数にあり並べ切れないうえ、
# 「自社のロゴと他社のロゴ」のように、見送る語を先に書けば迂回できてしまうためです。
# 語彙ではなく、語の形で見分けます。
rules:
  # 実在の人物への言及です。
  #
  # 敬称の直前が役職の語尾（師・士・員・者・長 など）であれば、人名ではなく
  # 職種の呼び方です。**語を並べて見送るのではなく、語の形で見分けます。**
  # 職種名は無数にあり、並べ切れないためです。
  - kind: real_person
    suggestion_key: describe_person_by_role
    patterns:
      # 姓名に敬称が付く言い回しです。役職の語尾で終わる語は人名としません。
      - "[一-龥]{2,4}[[:space:]]?[一-龥]{1,4}(?<![師士員人者長家手屋主店会部課係任生方社場先客工婦官番役名])さん"
      - "[一-龥]{2,4}[[:space:]]?[一-龥]{1,4}(?<![師士員人者長家手屋主店会部課係任生方社場先客工婦官番役])氏(?!名)"
      # カタカナの職種名に「さん」を付ける言い回しが多いため、カタカナは「氏」だけを見ます。
      - "[ァ-ヶー]{3,10}氏(?!名)"
      # 実在の人物を使う意図が明らかな言い回しです。**人を指す語を必須にします。**
      # 「実在する当院の外観写真」のような、人物と関係のない言及を止めないためです。
      - "実在[^。、]{0,8}(?:人物|弁護士|医師|税理士|会計士|俳優|女優|選手|監督|社長|タレント|モデル|歌手|アーティスト)"
      - 本人の写真
      - 有名人
      - 著名人
      # 著名な方のお名前です。
      - 大谷翔平
      - 藤井聡太
      - イチロー
  # 企業のロゴ・商標への言及です。
  #
  # **他社のものを指す語を必須にします。** 「◯◯のロゴ」という形だけでは、
  # 利用者自身のロゴなのか他社のものなのかを判定できません。「事務所のロゴ」
  # 「ブランドのロゴ」は、ほぼ確実に利用者自身のものです。
  - kind: brand_logo
    suggestion_key: remove_third_party_mark
    patterns:
      # 他社を指す語と、画面へ置く意図の語が揃った場合です。
      # **対象語が意図の語の目的語になっているかで決めます。**
      # 語と語の近さ（窓の幅）で決めると、幅を狭めれば取りこぼし、広げれば
      # 誤検出する往復が終わりません。日本語では助詞が手がかりになります。
      #
      #   止めます   : 他社のロゴを 大きく 掲載してください   （掲載するのは「ロゴ」です）
      #   止めません : 他社のロゴの 調査結果を 掲載します     （掲載するのは「調査結果」です）
      #
      # 対象語の直後が「を・と・は・も」であり、意図の語までに別の「を」が
      # 挟まらない場合に限ります。別の目的語が入れば、対象語は意図の語の
      # 目的語ではありません。「と」を含めるのは、モックの例文
      # 「他社事務所のロゴと並べた構図」を維持するためです。
      #
      # **「が」を加えません。** 「他社のロゴが入った看板」は主語であり、
      # 目的語ではありません。加えると「他社のロゴが目印です」のような文まで
      # 巻き込みます（issue #134）。
      #
      # 対象語のうしろに「画像・マーク・類」の複合名詞と、「だけ・のみ・など」の
      # 副助詞を許します。窓は 20 文字です。狭いと修飾の長い言い回しを
      # 取りこぼします（issue #134 で 6 件を実測しました）。
      #
      # **`ロゴマーク` を `ロゴ` より先に置きます。** 先に `ロゴ` が当たると、
      # 見つかった語が「ロゴ」だけになり、利用者へお伝えする内容が読みづらく
      # なります。
      # **意図の語を必須にします。** 商標の調査・出願は士業の中核業務ですので、
      # 「他社の商標を侵害しないか確認します」を止めてはいけません。
      #
      # **打ち消しが続く場合は止めません。** 「他社のロゴは使用しません」
      # 「競合のロゴは載せないでください」は、権利に配慮したお客さまの文であり、
      # 止めるべき文と正反対の内容です。助詞に「は」を加えると、主題を示す
      # 「は」が打ち消しや対比と結び付きやすいため、影響が大きく出ます
      # （PR #144 のレビューで、10 件中 7 件が新たに止まることが分かりました）。
      #
      # **丁寧な言い回しも打ち消しです**（issue #148）。窓を 4 文字にすると、
      # 「載せることができません」「掲載を控えております」「配置いたしかねます」
      # 「使用を避けております」が窓から外れて止まります。**B2B の商用文では、
      # この丁寧な形のほうが多く使われます。**
      #
      # **窓に置けるのは、ひらがなだけです。** 文字数だけを広げると、
      # 「載せて加工を控えめに」「配置して余白を不要なほど」のような、
      # **別の対象に掛かる語**まで打ち消しとして拾います（PR #157 のレビューで
      # 10 件を実測しました）。**打ち消しは、意図の語に活用の形で続きます。**
      # 間に漢字やカタカナが入るのは、別の語が挟まった証拠です。
      #
      # **読点をまたぐ形を 1 つだけ許します。** 「載せることは、いたしかねます。」は、
      # 日本語の商用文でごく普通に使われます。**このとき認める打ち消しは、
      # ひらがなで始まる形だけです。** 「載せてください、遠慮はいりません。」の
      # ような、読点の先で別の話に移る文を通さないためです。
      #
      # **「ず」は「み」が続く場合を除きます。** 「配置ずみ」「掲載ずみ」を
      # 打ち消しとして拾うと、止めるべき文を取りこぼします（issue #148）。
      #
      # **「不可」は「能」が続く場合を除きます。** 「載せてほしいのですが
      # 不可能でしょうか」は、掲載のお願いであって打ち消しではありません。
      #
      # **窓に置けるのは、ひらがなと、行為そのものを指す語だけです。**
      # ひらがなだけに限ると、「載せる予定はございません」「掲載を差し控えて
      # おります」のような、**漢字を挟む丁寧な打ち消し**が止まります
      # （PR #157 の 2 回目のレビューで 7 件を実測しました）。
      #
      # **並べるのは、行為そのものを指す語だけです。** 「加工」「余白」「装飾」の
      # ような**別の対象**を並べません。並べると、「載せて加工を控えめに」が
      # 打ち消しとして読まれます。
      #
      # **意図の語そのもの（掲載・配置・使用など）も並べません。**
      # それらは意図の語として先に当たりますので、窓へ入れる必要がありません。
      #
      # **「ません」に「か」「でしょ」が続く場合を除きます。**
      # 「入れてくださいませんか」「載せていただけませんか」は依頼であって
      # 打ち消しではありません（PR #157 の 2 回目のレビューより）。
      #
      # **「不要」に「でしょう」「な」が続く場合も除きます。**
      # 「載せてほしいのですが不要でしょうか」は問い合わせであり、
      # 「不要な装飾を省きます」は別の対象に掛かる語です
      # （PR #157 の 3 回目のレビューより）。
      #
      # **読点をまたぐ場合は、間に語が 1 つ以上あることを求めます。**
      # 読点の直後に打ち消しの語が来る形（「載せてください、遠慮はいりません。」）は、
      # **別の話へ移っている**ためです。ひらがなで始まる打ち消し
      # （「載せることは、いたしかねます。」）だけは、語が無くても認めます。
      - "(?:他社|他店|他の|別の|よその|競合|取引先|クライアント|先方|第三者)[^。、]{0,10}(?:ロゴマーク|ロゴ|商標|エンブレム)(?:画像|マーク|類)?(?:だけ|のみ|など)?[をとはも][^。を]{0,20}(?:載せ|のせ|入れ|配置|並べ|使い|使う|使用|置き|置く|添え|反映|描|入る|再現|表示|掲載|流用|そのまま|持って)(?!(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,12}(?:ません(?!か|でしょ)|ないで|ず(?!み)|禁止|不可(?!能)|不要(?!でしょう|な)|かね|差し控え|控え|避け|遠慮)|(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,12}、(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){1,8}(?:ません(?!か|でしょ)|ないで|ず(?!み)|禁止|不可(?!能)|不要(?!でしょう|な)|かね|差し控え|控え|避け|遠慮)|(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,12}、(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,8}(?:ません(?!か|でしょ)|ないで|かね))"
      # よく知られた企業名のロゴ・商標を、画面へ置く場合です。
      - "(?i)(?:Apple|Google|Amazon|Microsoft|Nike|スターバックス|マクドナルド|ユニクロ|トヨタ)[[:space:]]*の[[:space:]]*(?:ロゴマーク|ロゴ|商標|エンブレム)(?:画像|マーク|類)?(?:だけ|のみ|など)?[をとはも][^。を]{0,20}(?:載せ|のせ|入れ|配置|並べ|使い|使う|使用|置き|置く|添え|反映|描|入る|再現|表示|掲載|流用|そのまま|持って)(?!(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,12}(?:ません(?!か|でしょ)|ないで|ず(?!み)|禁止|不可(?!能)|不要(?!でしょう|な)|かね|差し控え|控え|避け|遠慮)|(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,12}、(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){1,8}(?:ません(?!か|でしょ)|ないで|ず(?!み)|禁止|不可(?!能)|不要(?!でしょう|な)|かね|差し控え|控え|避け|遠慮)|(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,12}、(?:[ぁ-んー]|こと|行為|予定|つもり|意向|方針|規程|規則|契約|法|上|著作権|商標権|権利|社内|当社|弊社|自社|使え|使い|使う|使っ){0,8}(?:ません(?!か|でしょ)|ないで|かね))"
      # よく知られた企業名を、まねる意図の言い回しとともに使う場合です。
      - "(?i)(?:Apple|Google|Amazon|Microsoft|Nike|スターバックス|マクドナルド|ユニクロ|トヨタ)[^。、]{0,12}(?:のような|のように|風|みたい|そっくり|を再現|をイメージ|に似せ)"
  # 第三者の著作物・作風への言及です。
  #
  # 一般名詞と重なる語（衣類の「ワンピース」、媒体名の「週刊少年」）は入れません。
  - kind: third_party_work
    suggestion_key: describe_style_by_attribute
    patterns:
      - "(?i)(?:ジブリ|ghibli|ディズニー|disney|ピクサー|pixar|ポケモン|pokemon|マーベル|marvel)"
      - "(?:鬼滅の刃|進撃の巨人|新世紀エヴァンゲリオン)"
      - "(?:村上春樹|村上隆|葛飾北斎|草間彌生)"
