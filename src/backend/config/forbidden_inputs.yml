# 禁止入力の検出規則です。
#
# 実在の人物・企業のロゴや商標・第三者の著作物への言及を見つけます
# （requirements.md 4.1 の 1）。見つかった場合は生成を行わず、理由を付して返します。
#
# **語や言い回しを足す場合は、このファイルへ追記します。コードへ直書きしません。**
# 検出は代表的な言い回しに限られます。すべての固有名詞を網羅するものではありません。
rules:
  # 実在の人物への言及です。
  - kind: real_person
    patterns:
      # 姓名に敬称が付く言い回しです。「お客さん」のようなひらがな始まりは拾いません。
      - "[一-龥]{2,4}[[:space:]]?[一-龥]{1,4}(?:さん|氏|様|選手|監督|社長)"
      - "[ァ-ヶー]{3,10}(?:さん|氏|様|選手|監督)"
      - 大谷翔平
      - 藤井聡太
      - イチロー
      - 本人の写真
      - 実在の人物
  # 企業のロゴ・商標への言及です。
  - kind: brand_logo
    patterns:
      - ロゴ
      - 商標
      - エンブレム
      - Apple
      - Google
      - Amazon
      - Microsoft
      - Nike
      - スターバックス
      - マクドナルド
      - ユニクロ
      - トヨタ
  # 第三者の著作物・作風への言及です。
  - kind: third_party_work
    patterns:
      - ジブリ
      - ディズニー
      - ピクサー
      - ポケモン
      - マーベル
      - 村上春樹
      - 村上隆
      - 葛飾北斎
      - 鬼滅の刃
      - ワンピース
      - 進撃の巨人
      - 週刊少年
