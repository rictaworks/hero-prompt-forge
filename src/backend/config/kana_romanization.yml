# かなをローマ字へ直す対応表です（requirements.md 4.1 の 6）。
#
# **日本語の固有名詞を翻訳しません。** 「櫻花堂」を "Cherry Blossom Hall" と
# 訳すと、別の店の名前になります。**読みをそのまま写します。**
#
# 方式はヘボン式です。生成モデルへ渡す指示は英語ですので、英語話者が読んで
# 元の音に近づく書き方を選びます。
#
# **拗音（きゃ・しゅ など）を先に引きます。** 1 文字ずつ引くと「きゃ」が
# "kiya" になります。
