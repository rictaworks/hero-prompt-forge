# 生成モデルごとの記法です（requirements.md 4.1 の 7、11）。
#
# **記法の違いを、素材を作る側へ持ち込みません。** 素材は 1 件 1 指示の英文の
# ままにしておき、整形の段で初めてモデルの都合に合わせます。
#
# **そのままプロンプトへ入る英文を、実装の中へ埋め込みません。**
# モデル各社の仕様は変わります（requirements.md 8）。変わったときに、
# このファイルだけを直せば済むようにします。
#
# `%<aspect_ratio>s` ・ `%<terms>s` には値が入ります。

# 役割ごとの述語です（issue #156）。
#
# **素材の役割は、控え（ノート）から受け取ります。** 素材の文字列を照合して
# 見分けると、言い回しが変わったときに黙って外れます。
#
# **撮影の手段を、画に写っているものとして述べません。** レンズは撮影の手段で
# あり、画に写るものではありません。`The image shows ..., a 35mm lens, ...` は
# **「35mm レンズが写った絵」を呼び込みかねません**（PR #154 の 3 回目のレビューより）。
#
# **上から順に見て、はじめに当たった役割の文へ入れます。**
# **どの役割にも当たらない素材は、既定の文（`body`）で述べます。**
#
# `%<terms>s` に素材の並びが入ります。
_narrative_role_clauses: &narrative_role_clauses
  # 撮影の手段です。**画に写るものではありません。**
  - roles: [lens_mm, key_light, fill_light, rim_light, depth_of_field]
    template: "The scene is photographed with %<terms>s"
  # 描き方です（イラスト・3D・抽象）。
  - roles: [line_quality, shading, palette, material, rendering, lighting, geometry, motion]
    template: "The image is rendered with %<terms>s"
  # その案の主役の置き方です。
  - roles: [variation_focus]
    template: "The image is led by %<terms>s"
  # 構図の指定です。**被写体の置き場所・視線・余白・余白を静かに保つ指定です。**
  - roles: [subject, gaze, reserved, restraint, person_safety, brand_color_restraint, tone_restraint]
    template: "The composition keeps %<terms>s"
  # 配色です。
  - roles: [brand_color]
    template: "The palette carries %<terms>s"
  # 全体の雰囲気です。
  - roles: [tone]
    template: "The scene carries %<terms>s"

# Midjourney 系です。
#
# **語をカンマで並べ、パラメータを本文の末尾へ付けます。**
# パラメータは本文の最後に置かなければ効きません。
midjourney:
  # 素材の区切りです。
  term_separator: ", "
  # アスペクト比のパラメータです。
  aspect_ratio_parameter: "--ar"
  # 打ち消しのパラメータです。**打ち消しが 1 件も無ければ付けません。**
  # 値の無い `--no` は受け付けられません。
  negative_parameter: "--no"

# Stable Diffusion 系です。
#
# **語をカンマで並べ、重み付けを括弧で表します。**
stable_diffusion:
  term_separator: ", "
  # 強める重みです。**モデルの版で見直す値です。**
  emphasis_weight: "1.2"

# DALL-E 系です。
#
# **自然文で書きます。** 語を並べるだけでは、要素どうしの関係が伝わりません。
# **打ち消しの欄を持ちません。**
dalle:
  # 先頭の 1 文です。**述語のある文にします。**
  opening: "This is a hero image for a website"
  # 画面の比を述べる 1 文です。**述語をここで与えます。**
  #
  # **コピースペースの段が比を述べる素材を作っていれば、その言い回しを
  # `%<clause>s` へ入れます。** 素材はいずれも `composed for ...` のように
  # 述語を持たない句ですので、そのままでは文になりません。
  frame: "The whole frame is %<clause>s"
  # 比を述べる素材が無い下書きのための言い回しです。
  default_frame_clause: "composed as a %<aspect_ratio>s crop"
  # 素材を並べる文です。**述語を持たせます。**
  #
  # **`includes` を使いません。** `include` は目的語に名詞句を取ります。
  # `composed for a 16:9 wide crop` のような過去分詞句を受けると、文になりません
  # （PR #154 の 2 回目のレビューより）。
  body: "The image shows %<terms>s"
  role_clauses: *narrative_role_clauses
  term_separator: ", "
  final_separator: ", and "
  pair_separator: " and "
  sentence_separator: " "
  period: "."
  # 画像の大きさです。
  #
  # **この呼び出しは `16:9` のような比を受け付けません。** 画素で指定します。
  #
  # **対象は DALL-E 3（`dall-e-3`）の画像生成です。** この版が受け付ける
  # 横長の大きさは `1792x1024` の 1 つだけです。新しい呼び出し（`gpt-image-1`）
  # は `1536x1024` を受け付け、`1792x1024` を弾きます。**版が変わったときに
  # どちらへ追随すべきかを判断できるよう、対象を明記します**（requirements.md 8）。
  #
  # **選べる大きさが、指定された比と違う場合があります。**
  # 黙って寄せません。**すり替えた事実を控えへ残し、画面に出します**
  # （PR #154 の 2 回目のレビューより）。
  api_version: "dall-e-3"
  sizes:
    "16:9": "1792x1024"
    "21:9": "1792x1024"
    "3:2": "1792x1024"

# nano banana 系（Gemini 系の画像生成）です。
#
# **自然文で書きます。**
# **打ち消しの欄を持ちません。** 会話文で指示する作りで、負の指定を渡す項目が
# ありません。同系統の Imagen でも、その項目は新しい版で廃止され、
# 「出したいものを肯定形で書く」ことが案内されています（PR #154 のレビューより）。
nano_banana:
  opening: "This is a hero image for a website"
  frame: "The whole frame is %<clause>s"
  default_frame_clause: "composed as a %<aspect_ratio>s crop"
  body: "The image shows %<terms>s"
  role_clauses: *narrative_role_clauses
  term_separator: ", "
  final_separator: ", and "
  pair_separator: " and "
  sentence_separator: " "
  period: "."
