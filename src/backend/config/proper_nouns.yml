# 日本語の固有名詞を見つける手がかりです（requirements.md 4.1 の 6）。
#
# **固有名詞を翻訳しません。** 「櫻花堂」を "Cherry Blossom Hall" と訳すと、
# 別の店の名前になります。読みをローマ字で写し、**何を指す名前かを併記します。**
#
# **語彙を並べません。** 店名・社名は無数にあり、並べ切れません。
# **名前の形で見分けます。**
#
# **手がかりは、曖昧でないものだけに絞ります。** 屋号の語尾（堂・屋・舎）だけを
# 手がかりにすると、「明るい部屋」「近所の本屋」「学校の食堂」といった一般名詞を
# 名前として拾います（PR #149 のレビューで、23 文中 20 文の誤検出を実測しました）。
# **通してよい文章を壊さないことを、見つけることと同じくらい重視します。**
#
# 手がかりは 2 つです。
#
#   1. かぎ括弧でくくられ、**名前であることが文中で示されている**
#      （「◯◯」という名前 ／ 「◯◯」（読み） ／ 店名は「◯◯」）
#   2. 会社の種別が付いている
#
# **かぎ括弧だけ、読みだけを手がかりにしません。** 日本語では強調にもかぎ括弧を
# 使い、難しい一般名詞にも読みを添えます。「安心」「囲炉裏（いろり）」を名前として
# 拾うと、日本語のまま生成モデルへ渡ります（PR #149 のレビューより）。
#
# **取りこぼしは残ります。**「さくら堂の焼き菓子です」の「さくら堂」は拾いません。
# 取りこぼしても、利用者の指定を壊しません。訳されることもありません。
# **書き方の案内は、入力フォーム（issue #71）で行います。**
#
# 各規則の項目です。
#
#   kind      : 種別です。記録とノートに使います
#   gloss     : 併記する意味説明です。**そのままプロンプトへ入る英文です**
#   patterns  : 見つける言い回しです。**名前の部分を 1 つ目の丸括弧で囲みます**
#
# **読みが分からない漢字は、ローマ字へ直しません。** 「東海林」は「しょうじ」
# とも「とうかいりん」とも読みます。読み方を推し量ると、別の名前になります。
# その場合は元の表記のまま残し、読みが分からない事実をノートへ書きます。
#
# **読みが丸括弧で添えられていれば、それを使います。**
# 「櫻花堂（おうかどう）」のような書き方は、日本語の商用文で普通に使われます。
rules:
  # かぎ括弧でくくられ、**名前であることが文中で示されている**ものです。
  #
  # **かぎ括弧だけを手がかりにしません。** 日本語では、強調にもかぎ括弧を
  # 使います。「安心」「ものづくり」を名前として拾うと、日本語のまま
  # 生成モデルへ渡ります（PR #149 のレビューより）。
  - kind: quoted_name
    gloss: a proper name
    patterns:
      - "「([^」]{1,20})」(?=という(?:名前|店|お店|ブランド|会社|サービス|屋号))"
      - "『([^』]{1,20})』(?=という(?:名前|店|お店|ブランド|会社|サービス|屋号))"
      - "「([^」]{1,20})」(?=[（(][ぁ-ゖァ-ヴー]{1,20}[）)])"
      - "『([^』]{1,20})』(?=[（(][ぁ-ゖァ-ヴー]{1,20}[）)])"
      # **手がかりが左側にある書き方です。**
      # 「屋号は「はな花」です」のように、名前であることを先に述べる形も
      # 日本語の商用文で普通に使われます（PR #149 のレビューより）。
      #
      # **助詞をすぐ後ろに求めます。** 間に語を挟むと、「名前のとおり
      # 「明るい」雰囲気です」のような文まで拾います。
      - "(?:名前|店名|屋号|社名|ブランド名|サービス名|商号)(?:は|が|を|：|:|、)[[:space:]]*「([^」]{1,20})」"
      - "(?:名前|店名|屋号|社名|ブランド名|サービス名|商号)(?:は|が|を|：|:|、)[[:space:]]*『([^』]{1,20})』"
  # 会社の種別が付く名前です。
  - kind: company
    gloss: a company name
    patterns:
      - "(?<![ぁ-ゖァ-ヴ一-龥A-Za-z0-9])株式会社([ぁ-ゖァ-ヴー一-龥A-Za-z0-9]{1,20}?)(?=が|は|を|に|で|と|へ|も|、|。|\\s|$)"
      - "([ぁ-ゖァ-ヴー一-龥A-Za-z0-9]{1,20}?)株式会社"
      - "(?<![ぁ-ゖァ-ヴ一-龥A-Za-z0-9])合同会社([ぁ-ゖァ-ヴー一-龥A-Za-z0-9]{1,20}?)(?=が|は|を|に|で|と|へ|も|、|。|\\s|$)"
      - "(?<![ぁ-ゖァ-ヴ一-龥A-Za-z0-9])有限会社([ぁ-ゖァ-ヴー一-龥A-Za-z0-9]{1,20}?)(?=が|は|を|に|で|と|へ|も|、|。|\\s|$)"

# 屋号の語尾の読みです。
#
# **店名の語尾は読みが決まっています。** 「さくら堂」の「堂」は「どう」です。
# かなと語尾だけでできた名前は、これで読みが決まります。
#
# **語尾以外の漢字には使いません。** 読みが決まらないためです。
# **長い語尾から先に引きます。** 「工房」を「房」として読みません。
shop_suffix_readings:
  堂: どう
  屋: や
  亭: てい
  庵: あん
  軒: けん
  舎: しゃ
  荘: そう
  工房: こうぼう
  商店: しょうてん
  食堂: しょくどう
  珈琲: こーひー
  牧場: ぼくじょう
  写真館: しゃしんかん
  製作所: せいさくしょ
