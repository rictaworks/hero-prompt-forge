# 日本語の固有名詞を見つける手がかりです（requirements.md 4.1 の 6）。
#
# **固有名詞を翻訳しません。** 「櫻花堂」を "Cherry Blossom Hall" と訳すと、
# 別の店の名前になります。読みをローマ字で写し、**何を指す名前かを併記します。**
#
# **語彙を並べません。** 店名・社名は無数にあり、並べ切れません。
# **名前の形（かぎ括弧・会社の種別・屋号の語尾）で見分けます。**
#
# 各規則の項目です。
#
#   kind      : 種別です。記録とノートに使います
#   gloss     : 併記する意味説明です。**そのままプロンプトへ入る英文です**
#   patterns  : 見つける言い回しです。**名前の部分を 1 つ目の丸括弧で囲みます**
#
# **読みが分からない漢字は、ローマ字へ直しません。** 「東海林」は「しょうじ」
# とも「とうかいりん」とも読みます。読み方を推し量ると、別の名前になります。
# その場合は元の表記のまま残し、読みが分からない事実をノートへ書きます。
#
# **読みが丸括弧で添えられていれば、それを使います。**
# 「櫻花堂（おうかどう）」のような書き方は、日本語の商用文で普通に使われます。
rules:
  # かぎ括弧でくくられた名前です。日本語の商用文で最も多い書き方です。
  - kind: quoted_name
    gloss: a proper name
    patterns:
      - "「([^」]{1,20})」"
      - "『([^』]{1,20})』"
  # 会社の種別が付く名前です。
  - kind: company
    gloss: a company name
    patterns:
      - "(?<![ぁ-ゖァ-ヴ一-龥A-Za-z0-9])株式会社([ぁ-ゖァ-ヴ一-龥A-Za-z0-9]{1,20}?)(?=が|は|を|に|の|で|と|へ|も|、|。|\\s|$)"
      - "([ぁ-ゖァ-ヴ一-龥A-Za-z0-9]{1,20}?)株式会社"
      - "(?<![ぁ-ゖァ-ヴ一-龥A-Za-z0-9])合同会社([ぁ-ゖァ-ヴ一-龥A-Za-z0-9]{1,20}?)(?=が|は|を|に|の|で|と|へ|も|、|。|\\s|$)"
      - "(?<![ぁ-ゖァ-ヴ一-龥A-Za-z0-9])有限会社([ぁ-ゖァ-ヴ一-龥A-Za-z0-9]{1,20}?)(?=が|は|を|に|の|で|と|へ|も|、|。|\\s|$)"
  # 屋号の語尾が付く名前です。
  #
  # **語尾を含めて 1 つの名前です。** 「さくら堂」の「堂」を落とすと、
  # 別の名前になります。
  #
  # **長い語尾から先に並べます。** 「写真館」を「館」として切ると、
  # 「東海林写真」という別の名前になります。
  - kind: shop_name
    gloss: a shop name
    patterns:
      - "([ぁ-ゖァ-ヴ一-龥]{1,10}(?:写真館|製作所|商店|食堂|工房|牧場|珈琲|堂|屋|亭|庵|軒|舎|荘))"

# 屋号の語尾の読みです。
#
# **店名の語尾は読みが決まっています。** 「さくら堂」の「堂」は「どう」です。
# かなと語尾だけでできた名前は、これで読みが決まります。
#
# **語尾以外の漢字には使いません。** 読みが決まらないためです。
# **長い語尾から先に引きます。** 「工房」を「房」として読みません。
shop_suffix_readings:
  堂: どう
  屋: や
  亭: てい
  庵: あん
  軒: けん
  舎: しゃ
  荘: そう
  工房: こうぼう
  商店: しょうてん
  食堂: しょくどう
  珈琲: こーひー
  牧場: ぼくじょう
  写真館: しゃしんかん
  製作所: せいさくしょ
