# 色の名前です（requirements.md 4.1 の 5）。
#
# **生成モデルへ色コードを渡しません。** `#0E7C7B` と書いても、モデルは色として
# 受け取りません。**色の名前で渡します。**
#
# 名前は、色相・彩度・明度から機械的に決めます。**名前を一覧で持ちません。**
# 色は無数にあり、並べ切れないためです。
#
# **英語の一般的な色名だけを使います。** 「セルリアン」「ヴァーミリオン」のような
# 細かい名前は、モデルによって解釈が割れます。
#
# **色相だけで名づけません。** 明るさと鮮やかさを修飾語で添えます。
# 色相だけでは、ベージュが `orange`、深緑が `green` になり、**利用者の
# ブランドカラーとかけ離れた指示**を生成モデルへ渡すことになります。
# アートディレクションノート（requirements.md 4.1 の 9）は「ブランドカラーの
# 再現度」を確認観点に挙げます。名前が実際の色から離れると、確かめられません。

# 彩度がこの値以下なら、色みが無いものとして扱います（0.0 から 1.0）。
achromatic_saturation: 0.12

# 明度がこの値以下なら黒、この値以上なら白として扱います（0.0 から 1.0）。
black_lightness: 0.12
white_lightness: 0.92

# 色みの無い色の名前です。
achromatic_name: gray

# 明るさと鮮やかさを表す修飾語です。
#
# **色相の名前の前に 1 つだけ付けます。** 2 つ以上重ねると（`muted deep green`）、
# モデルによって解釈が割れます。**明るさを先に見ます。** 明暗の違いのほうが、
# 鮮やかさの違いより見た目に効くためです。
modifiers:
  # 明度がこの値以下なら「深い」と表します（0.0 から 1.0）。
  deep_lightness: 0.30
  deep_name: deep
  # 明度がこの値以上なら「淡い」と表します（0.0 から 1.0）。
  pale_lightness: 0.72
  pale_name: pale
  # 彩度がこの値以下なら「くすんだ」と表します（0.0 から 1.0）。
  muted_saturation: 0.30
  muted_name: muted

# 色相の範囲と名前です（0 度から 360 度）。
#
# **範囲は上限を含みません。** 隣り合う範囲が重ならないようにするためです。
# 最後の範囲は 360 度で閉じ、0 度へ戻ります。
hues:
  - from: 0
    to: 15
    name: red
  - from: 15
    to: 45
    name: orange
  - from: 45
    to: 70
    name: yellow
  - from: 70
    to: 170
    name: green
  - from: 170
    to: 195
    name: teal
  - from: 195
    to: 255
    name: blue
  - from: 255
    to: 315
    name: purple
  - from: 315
    to: 345
    name: pink
  - from: 345
    to: 360
    name: red
