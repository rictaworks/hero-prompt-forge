# PostgreSQL の接続設定です。
#
# 接続先はすべて環境変数から読みます。ソースに資格情報を書きません。
#
# 本番はデータベースを1つだけ使います。Rails 8 の既定は、ジョブ（Solid Queue）と
# キャッシュ（Solid Cache）を別データベースへ置きます。しかし接続先を URL 1本で
# 与えると、`database:` に別名を書いても URL 側の名前が使われるため、結局は同じ
# データベースを指します。それを別物として扱うと `db:prepare` が「そのデータベースは
# 存在する」と判断して表を作らず、本番の起動時にだけ「表が無い」と言って落ちます。
# そのため本番の項目を1つに戻し、ジョブとキャッシュの表は通常の移行で主データベースへ
# 作ります。
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>

test:
  <<: *default
  # Rails は有効な RAILS_ENV だけでなく、このファイル全体の ERB を評価してから
  # 設定を組み立てます（`load_database_yaml`）。そのため、本番で TEST_DATABASE_URL を
  # 渡していなくても、この節の ERB は必ず評価されます。既定値が無いと
  # `bin/rails db:prepare` が本番コンテナの起動のたびに落ちます（issue #190）。
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://localhost/hero_prompt_forge_test") %>

production:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") %>
