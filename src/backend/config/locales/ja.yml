      total: "合計"
      max: "最大"
      median: "中央値"
      degraded_ratio: "縮退モードでの生成比率"
      delivered: "成果物を提供した件数"
      degraded: "うち縮退"
      evaluation: "評価メモの記録率と評価傾向"
      outputs: "案の数"
      notes: "記録された評価メモ"
      by_rating: "評価の分布"
      regeneration: "再生成率"
      projects: "プロジェクト数"
      regenerations: "再生成の回数"
      quota_exhausted: "上限到達の発生数"
      quota_reclaimed: "クォータ返還の発生数"
      ratio_unit: "％"
      count_unit: "件"
    labels:
      separator: "、"
      published: "公開済み"
      draft: "未公開"
      current: "いま使う版"
      none: "—"
      show: "開く"
      publish: "この版を公開する"
      create: "この内容で版を作る"
      recheck: "判定を取り直す"
      reset_quota: "本日の枠をリセットする"
      back: "戻る"
    dashboard:
      description: "規則辞書の編集・利用者とプラン値の管理・クォータの手動リセット・利用状況の集計を行えます。"
    rule_dictionaries:
      description: "公開済みの版は書き換えません。内容を変える場合は、新しい版を作って公開します。公開した瞬間から、次の生成に効きます。"
      new_description: "いま使う版の内容を写してあります。直したい箇所だけを書き換えてから、版の名前を付けて作成してください。"
      json_help: "JSON で書きます。読めない内容は受け付けません。"
      empty: "規則辞書がまだありません。"
      created: "新しい版を作りました。内容を確かめてから公開してください。"
      published: "この版を公開しました。次の生成から効きます。"
      already_published: "すでに公開済みの版です。"
      invalid_json: "%{field} の内容を JSON として読めませんでした。書き方をご確認ください。"
    users:
      description: "プラン値の確認と、手動再判定を行えます。プラン値を手で書き換える経路は設けていません。"
      empty: "利用者がまだいません。"
      no_actions: "この利用者に対する管理の操作は、まだありません。"
      no_quota: "本日の消費がありませんので、リセットは要りません。"
      quota_reset: "本日の消費をリセットしました。当日中にもう一度生成できます。"
      rechecked: "判定を取り直し、プラン値へ反映しました。"
      recheck_unavailable: "判定サービスへ届かなかったため、プラン値は変えていません。"
      cooling_down: "再判定はまだ要求できません。%{available_at} 以降にお試しください。"
    metrics:
      description: "仕様が定める測定軸だけを表示します。利用者ごとの件数は、個人を特定できない分布として表示します。"
      unrecorded: "コピーされた案の分布と稼働率は、まだ記録していません。"
  errors:
    common:
      next_action_unknown: "解決しない場合は info@rictaworks.jp までご連絡ください。"
    unauthorized:
      message: "ログインが必要です。"
      next_action: "X でログインしてから、もう一度お試しください。"
    forbidden:
      message: "この操作を行う権限がありません。"
      next_action: "利用条件をご確認ください。"
    not_found:
      message: "お探しのものが見つかりませんでした。"
      next_action: "一覧から選び直してください。"
    invalid_input:
      message: "入力の内容に誤りがあります。"
      next_action: "赤く示された項目を直してから、もう一度お試しください。"
    service_unavailable:
      message: "ただいま処理を受け付けられません。"
      next_action: "時間をおいて、もう一度お試しください。"
    # 禁止入力で差し戻したときの文言です（requirements.md 4.1 の 1）。
    # **枠を使っていないことを、必ずお伝えします。**
    forbidden_input:
      message: "権利に触れるおそれのある内容が含まれているため、生成を行いませんでした。"
      next_action: "示された箇所を、役割や特徴の説明へ書き換えてから、もう一度お試しください。この差し戻しでは生成枠を使っていません。"
    # 人の操作だと確かめられなかったときの文言です（requirements.md 5.2）。
    # **通らなかった理由を書きません。** 通り抜け方を探る手がかりになります。
    human_verification_failed:
      message: "人の操作であることを確認できませんでした。"
      next_action: "画面を読み込み直してから、もう一度お試しください。解決しない場合は info@rictaworks.jp までご連絡ください。"
    # 本日の枠を使い切ったときの文言です（requirements.md 4.4）。
    # **次回のリセット時刻を必ず提示します。曖昧なエラーを返しません。**
    quota_exhausted:
      message: "本日の生成枠を使い切りました。"
      next_action: "次回のリセットは %{reset_at} です。それまでお待ちください。"
  # 時刻の書き方です。**文ではありませんので、`formats` の下へ置きます。**
  # Rails の標準の置き場です。`I18n.l(time, format: :reset_at)` で引きます。
  time:
    formats:
      # 次回のリセット時刻の書き方です（requirements.md 4.4）。
      reset_at: "%-m月%-d日 %H:%M"
  # 生成リクエストの応答に添える文言です（requirements.md 12.1）。
  #
  # **記録に残る差し戻しの理由は、開発者向けの種別です。**
  # 利用者へは、ここの文言と次に行う操作をお返しします。
  prompt_requests:
    failure:
      rejected:
        # **`errors.forbidden_input.message` と同じ事象です。**
        # 受け付けたその場でお返しする文言（`errors`）と、あとから状態を
        # 取り出したときの文言（ここ）で、**時制の受け取られ方が違います。**
        # 片方を直したらもう片方も見てください。
        message: "権利に触れるおそれのある内容が含まれているため、生成を行いませんでした。"
        next_action: "入力を書き換えて、もう一度お試しください。この差し戻しでは生成枠を使っていません。"
      failed:
        message: "生成に失敗しました。"
        next_action: "生成枠はお返ししています。もう一度お試しください。"
