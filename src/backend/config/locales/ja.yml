# 画面・応答に出す文言です。
#
# 文言をモデルやコントローラへ直書きしません。ここへ追加します。
# 日本語版のみを提供するため、他の言語のファイルを置きません。
ja:
  # 検証で弾いたときの文言です。日本語版のみを提供するため、標準の訳を持ちません。
  # 使っている検証の分だけを定義します。
  #
  # **文言が欠けていると、検証の失敗ではなく文言の欠落として失敗します。**
  # 起きる例外の種類が変わり、原因の切り分けが遠回りになります。
  # 検証と文言の対応がそろっていることは、
  # `spec/config/validation_messages_spec.rb` が確かめます。
  activerecord:
    errors:
      messages:
        blank: "を入力してください。"
        # 保存に失敗したことを開発者へ知らせる文言です（RecordInvalid）。
        record_invalid: "%{errors}のため保存できませんでした。"
        inclusion: "に選べない値が指定されています。"
        taken: "はすでに使われています。"
        # 関連が欠けている場合の文言です（belongs_to）。
        required: "を指定してください。"
        # 書式が合わない場合の文言です（format）。
        invalid: "の形式が正しくありません。"
        # 長さの上限を超えた場合の文言です（length の maximum）。
        too_long: "は%{count}文字以内で入力してください。"
  # 開発者用の管理画面の文言です。一般の利用者には見えません。
  #
  # **見出しと項目名は `headings` の下へ置きます。** 見出しは文ではありませんので、
  # 句点で終わりません。文（説明・案内）は句点で終わります。
  admin:
    headings:
      title: "hero-prompt-forge 管理"
      dashboard: "管理画面"
    dashboard:
      description: "規則辞書の編集・利用者の管理・クォータのリセット・利用状況の集計は、順次ここへ足します。"
  errors:
    common:
      next_action_unknown: "解決しない場合は info@rictaworks.jp までご連絡ください。"
    unauthorized:
      message: "ログインが必要です。"
      next_action: "X でログインしてから、もう一度お試しください。"
    forbidden:
      message: "この操作を行う権限がありません。"
      next_action: "利用条件をご確認ください。"
    not_found:
      message: "お探しのものが見つかりませんでした。"
      next_action: "一覧から選び直してください。"
    invalid_input:
      message: "入力の内容に誤りがあります。"
      next_action: "赤く示された項目を直してから、もう一度お試しください。"
    service_unavailable:
      message: "ただいま処理を受け付けられません。"
      next_action: "時間をおいて、もう一度お試しください。"
