# 画面・応答に出す文言です。
#
# 文言をモデルやコントローラへ直書きしません。ここへ追加します。
# 日本語版のみを提供するため、他の言語のファイルを置きません。
ja:
  # 検証で弾いたときの文言です。日本語版のみを提供するため、標準の訳を持ちません。
  # 使っている検証の分だけを定義します。
  #
  # **文言が欠けていると、検証の失敗ではなく文言の欠落として失敗します。**
  # 起きる例外の種類が変わり、原因の切り分けが遠回りになります。
  # 検証と文言の対応がそろっていることは、
  # `spec/config/validation_messages_spec.rb` が確かめます。
  activerecord:
    errors:
      messages:
        blank: "を入力してください。"
        # 保存に失敗したことを開発者へ知らせる文言です（RecordInvalid）。
        record_invalid: "%{errors}のため保存できませんでした。"
        inclusion: "に選べない値が指定されています。"
        taken: "はすでに使われています。"
        # 関連が欠けている場合の文言です（belongs_to）。
        required: "を指定してください。"
        # 書式が合わない場合の文言です（format）。
        invalid: "の形式が正しくありません。"
        # 長さの上限を超えた場合の文言です（length の maximum）。
        too_long: "は%{count}文字以内で入力してください。"
        # 数値でない場合の文言です（numericality）。
        not_a_number: "は数値で入力してください。"
        # 整数でない場合の文言です（numericality の only_integer）。
        not_an_integer: "は整数で入力してください。"
        # 下限を下回った場合の文言です（numericality の greater_than_or_equal_to）。
        greater_than_or_equal_to: "は%{count}以上で入力してください。"
  # アートディレクションノートの文言です（requirements.md 4.1 の 9）。
  #
  # **生成後に人間が確認すべき観点を、案ごとに添えます。**
  # 生成 AI の出力は、指示どおりとは限りません。**出来上がった絵を見て
  # 確かめていただく必要があります。**
  #
  # **見出しは `headings` の下へ置きます。** 見出しは文ではありませんので、
  # 句点で終わりません。
  art_direction_note:
    headings:
      checkpoints: "出来上がった絵で確かめること"
      adjustments: "この案で調整したこと"
      copy_space: "文字を置く余白の読みやすさ"
      brand_color: "ブランドカラーの再現度"
      cliche: "AI っぽさの混入"
      person_safety: "人物の写り方"
    # 見出しではない、文の中へ差し込む呼び名と区切りです。
    labels:
      # 語を並べるときの区切りです。
      separator: "・"
      # 文と文をつなぐときの区切りです。
      sentence_separator: " "
      # 役割の呼び名です。
      roles:
        person_safety: "人物の写り方"
        depth_of_field: "被写界深度"
        subject: "被写体の位置"
        gaze: "被写体の収まり"
        reserved: "文字を置く余白"
        restraint: "余白を静かに保つ指定"
    checkpoints:
      copy_space: "%{position}に、見出しと CTA ボタンを置ける余白がありますか。文字を重ねたときに読めるだけの明るさの差がありますか。"
      copy_space_missing: "文字を置く余白の指定が入っていません。この案は使わないでください。"
      brand_color: "指定いただいた %{colors} が、絵の中にアクセントとして現れていますか。画面全体を塗る色になっていませんか。"
      brand_color_weakened: "%{colors} は、AI っぽさを避ける規則に当たったため弱めています。ほのかに感じる程度に留まっていますか。強く出ている場合はお知らせください。"
      brand_color_absent: "ブランドカラーのご指定がありませんでした。色の再現度は確認の対象外です。"
      cliche: "青紫のグラデーション・意味のない浮遊物・過剰な光の粒など、生成 AI にありがちな表現が入っていませんか。指示では避けていますが、出力に現れることがあります。"
      person_safety: "顔や指の形が崩れていませんか。%{compositions}という指示で崩れを避けていますが、出力に現れることがあります。"
      person_safety_unlikely: "この業種では人物が写らない見込みのため、人物の指示を入れていません。人物が写っている場合は、この案を使わないでください。"
      person_safety_no_rule: "この絵のスタイルには、人物の崩れを避ける指示の定めがありません。人物が写っている場合は、顔や指の形をよくご確認ください。"
      person_safety_dropped: "この案は具体物を置かないため、人物の指示を外しています。人物が写っている場合は、この案を使わないでください。"
    adjustments:
      brand_color_weakened: "%{name}（%{color}）は、AI っぽさを避ける規則に当たったため、ほのかに感じる程度まで弱めて残しました。"
      brand_color_accent: "%{name}（%{color}）は、主役に添えるアクセントとして入れました。"
      brand_color_secondary: "%{name}（%{color}）は、1 色目を支える細部として、より弱く入れました。"
      style_palette_weakened: "絵のスタイルが持つ配色の指定は、ブランドカラーを優先するため弱めました。"
      tone_restrained: "全体の雰囲気の指定は、文字を置く余白を飾らないように控えめにしました。"
      anti_ai_removed: "「%{term}」は、生成 AI にありがちな表現に当たるため外しました。"
      variation_dropped: "この案は具体物を置かないため、%{role}の指示を外しました。"
  # 入力の選択肢の呼び名です。**見出しではなく、文の中へ差し込みます。**
  input_choices:
    labels:
      copy_space_positions:
        left: "画面の左三分の一"
        right: "画面の右三分の一"
        bottom_center: "画面の下三分の一の中央"
  # 開発者用の管理画面の文言です。一般の利用者には見えません。
