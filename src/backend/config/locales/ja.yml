      recheck_available_at: "次に再判定できる日時"
      quota_today: "本日の消費"
      quota_day: "クォータ日"
      quota_status: "状態"
      reset_by_admin: "手動リセット"
      admin_actions: "管理の操作の記録"
      actor: "実施者"
      action: "操作"
      occurred_at: "日時"
      requests_total: "生成リクエスト数"
      by_industry: "業種別"
      by_style_family: "スタイル系統別"
      by_target_model: "生成モデル別"
