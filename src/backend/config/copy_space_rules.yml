# コピースペースの構図規定です（requirements.md 4.1 の 4、4.2）。
#
# ヒーローイメージには、見出しと CTA ボタンを重ねる余白が要ります。
# **コピースペースを持たない案を出しません。** 位置が決まらないまま進むと、
# 被写体が画面いっぱいに入った、文字を置けない絵ができます。
#
# **値は、そのままプロンプトへ入れられる英文で書きます。** 実装は、
# 文字列でない値をその場で失敗させます。
#
# **素材は 1 件 1 指示です。** 1 件へ複数の指示を詰め込むと、
# アンチAIルック規則が 1 語に当たったときに、関係のない指示まで道連れに
# なります（PR #135 のレビューより）。
#
# 各位置は次の 4 つの指示を持ちます。**それぞれ役割が違います。**
#
#   reserved   : 余白そのものの指定です
#   subject    : 被写体を置く場所です。余白と重ならない側へ寄せます
#   gaze       : 被写体の収まりと視線です。**肯定形で書きます**
#   restraint  : 余白側を静かに保つ指定です。文字の可読性を守ります
#
# **1 件へ 2 つの性質を書きません。** アンチAIルック規則が片方の語に
# 当たると、その指示が丸ごと落ちます（PR #135 のレビューより）。
#
# **打ち消しの言い回しを書きません。** 生成モデルは打ち消しの解釈が弱く、
# `without extending into it` は「余白へ入り込んだ絵」を呼び込みかねません
# （PR #145 のレビューより）。収めたい範囲を肯定形で書きます。
#
# **三分割の交点は、高さまで書きます。** 「右の交点」は上下に 2 つあり、
# 位置が定まりません。
#
# **下中央に余白を空ける場合は、視線の考え方が変わります。** 下を向かせると
# うつむいた絵になります。水平か遠景へ向けて、下三分の一を空けます。
positions:
  left:
    reserved: clear copy space across the left third of the frame
    subject: the main subject placed at the upper right intersection of a rule of thirds grid
    gaze: the subject contained within the right two thirds of the frame
    restraint: the left third rendered as an even low contrast surface
  right:
    reserved: clear copy space across the right third of the frame
    subject: the main subject placed at the upper left intersection of a rule of thirds grid
    gaze: the subject contained within the left two thirds of the frame
    restraint: the right third rendered as an even low contrast surface
  bottom_center:
    reserved: clear copy space across the lower third of the frame
    subject: the main subject placed along the upper third line of a rule of thirds grid
    gaze: the subject looking level toward the far distance
    restraint: the lower third rendered as an even low contrast surface

# アスペクト比ごとの構図の言い方です。
#
# 横に長いほど、被写体を寄せる余地が広がります。同じ余白の指定でも、
# 比率によって画づくりが変わるため、比率を明示します。
aspect_ratios:
  "16:9": composed for a 16:9 wide crop
  "21:9": composed for a 21:9 ultra wide crop
  "3:2": composed for a 3:2 crop
