# コード規約の検査です。
plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.3
  SuggestExtensions: false
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/*_create_solid_*.rb"
    - "vendor/**/*"
    - "tmp/**/*"
    - "storage/**/*"

# ── プロジェクトの決まりに対応する検査 ──────────────────
# セキュリティの観点からグローバル変数を禁止します。
Style/GlobalVars:
  Enabled: true

# 例外を握りつぶす書き方を禁止します（フォールバック禁止）。
Lint/SuppressedException:
  Enabled: true
  AllowComments: false

# 例外を捨てる rescue を禁止します。
Style/RescueStandardError:
  Enabled: true
  EnforcedStyle: explicit

# ── 文体・分量 ──────────────────────────────────────────
Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/**/*"

Layout/LineLength:
  Max: 120

# 日本語のコメントを許可します。
Style/AsciiComments:
  Enabled: false

# 1つの例で複数の観点を確認することを許します。
# 記録の内容は「開始」と「完了」の対で1つの振る舞いであり、
# 分割すると同じ準備を二度書くことになり、かえって読みにくくなるためです。
RSpec/MultipleExpectations:
  Max: 4

# 期待する構造をそのまま書く例では行数が伸びます。
# 構造を分割して書くと、かえって何を期待しているのかが読めなくなるため許します。
RSpec/ExampleLength:
  Max: 12

# 設定・定義そのものを検証する spec は、対象がクラスではありません。
RSpec/DescribeClass:
  Exclude:
    - "spec/config/**/*"

# 外部サービスとのやり取りは、要求の組み立て・送信・応答の検証・変換で
# 手続きが増えます。無理に分割すると呼び出しの流れが追えなくなるため、
# 外部サービスの窓口となるクラスに限って上限を緩めます。
Metrics/ClassLength:
  Exclude:
    - "app/services/auth/*.rb"
    - "app/services/follower_gate_client.rb"
    # 組み立ての段は、**当てた素材の役割を控えへ残します**（issue #156）。
    # 控えの組み立ては、その段が持つ知識でしか書けません。別の持ち場へ
    # 移すと、どの段が何を当てたのかが読めなくなります。
    - "app/services/generation/conflict_resolver.rb"
    - "app/services/generation/style_spec.rb"
    - "app/services/generation/variation_builder.rb"
    # 生成のジョブは、**状態の見分け方そのもの**を持ちます（issue #54、#169）。
    # 拾い直す条件・決着だけが残った場合・繰り返さない誤りの分け方は、
    # いずれもこの持ち場の判断です。分けると、どの条件がどの状態に効くのかが
    # 追えなくなります。
    - "app/jobs/generate_prompt_job.rb"

# 移行は表の定義をそのまま並べるため行数が伸びます。
# 分割すると、どの表がどう作られるのかが追えなくなります。
Metrics/MethodLength:
  Exclude:
    - "db/migrate/*.rb"
